[workspace]
resolver = "3"
members = [
    "crates/code",
    "crates/nuillu-code",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/ryo33/nuillu-code"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"

[workspace.dependencies]
lutum = { git = "https://github.com/Hihaheho/lutum" }
lutum-protocol = { git = "https://github.com/Hihaheho/lutum" }
lutum-trace = { git = "https://github.com/Hihaheho/lutum" }

anyhow = "1"
async-trait = "0.1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["sync", "time", "rt", "macros"] }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }

# nuillu upstream (independent repo; pinned to a known-compatible commit)
nuillu-blackboard = { git = "https://github.com/Hihaheho/nuillu", rev = "95b9d1ea61965c417213313fa2fa91894c68c84f" }
nuillu-module = { git = "https://github.com/Hihaheho/nuillu", rev = "95b9d1ea61965c417213313fa2fa91894c68c84f" }
nuillu-types = { git = "https://github.com/Hihaheho/nuillu", rev = "95b9d1ea61965c417213313fa2fa91894c68c84f" }
nuillu-server = { git = "https://github.com/Hihaheho/nuillu", rev = "95b9d1ea61965c417213313fa2fa91894c68c84f" }
nuillu-visualizer-egui = { git = "https://github.com/Hihaheho/nuillu", rev = "95b9d1ea61965c417213313fa2fa91894c68c84f" }
nuillu-visualizer-protocol = { git = "https://github.com/Hihaheho/nuillu", rev = "95b9d1ea61965c417213313fa2fa91894c68c84f" }

eframe = { version = "0.34.3", features = ["persistence"] }
